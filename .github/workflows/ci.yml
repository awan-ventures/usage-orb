name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test on runner architecture
        run: ./scripts/test.sh
      - name: Build universal app
        run: ./scripts/build.sh
      - name: Zip unsigned app
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/UsageOrb.app build/UsageOrb-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: UsageOrb-unsigned
          path: build/UsageOrb-unsigned.zip
